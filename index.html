<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Managerial Accounting Problems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#fff;--surface:#fff;--bg3:#f5f4f2;--ink:#09090b;--muted:#62626a;--line:#e7e5e4;--accent:#0b0b0d;--accent-ink:#fff;--accent-text:#c2410c;--good:#15803d;--good-soft:#ecfdf3;--bad:#dc2626;--bad-soft:#fef2f2;--learn:#1d4ed8;--learn-soft:#eff6ff;--fill:#fff7ed;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px -10px rgba(0,0,0,.12);--daybreak:linear-gradient(90deg,#ffb020 0%,#ff5c28 26%,#f2367f 52%,#7c4dff 78%,#3355ff 100%);--sans:Geist,Inter,"Helvetica Neue",Arial,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--surface:#111;--bg3:#1a1a1a;--ink:#ededed;--muted:#a1a1a1;--line:#262626;--accent:#fafafa;--accent-ink:#0a0a0a;--accent-text:#ff8a3d;--good:#4ade80;--good-soft:#0f2a1a;--bad:#fb7185;--bad-soft:#2a1216;--learn:#93c5fd;--learn-soft:#0f1a2e;--fill:#2a1a0c;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#111;--bg3:#1a1a1a;--ink:#ededed;--muted:#a1a1a1;--line:#262626;--accent:#fafafa;--accent-ink:#0a0a0a;--accent-text:#ff8a3d;--good:#4ade80;--good-soft:#0f2a1a;--bad:#fb7185;--bad-soft:#2a1216;--learn:#93c5fd;--learn-soft:#0f1a2e;--fill:#2a1a0c;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);margin:0}
.wrap{max-width:780px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.top b.brand{font-weight:800;letter-spacing:-.01em}
.sp{flex:1}
.me{margin:0;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent-text);font:600 14px var(--sans);cursor:pointer;padding:4px}
h1{font:800 clamp(26px,5vw,34px)/1.12 var(--sans);letter-spacing:-.015em;margin:22px 0 6px;text-wrap:balance}
h2{font:800 clamp(22px,4.4vw,28px)/1.15 var(--sans);letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
h3{font:700 18px/1.3 var(--sans);margin:0 0 6px}
.eyebrow{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 12px}
.how{display:grid;gap:8px;margin:16px 0 8px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg3)}
.how div{display:flex;gap:10px}.how i{font-style:normal;font:700 13px var(--mono);color:var(--accent-text);min-width:18px}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 15px var(--sans);padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.fu button:focus-visible,.ver:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ch{margin-top:30px}
.ch>h3{font-size:20px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.type{padding:14px 0;border-bottom:1px solid var(--line)}
.type .goal{color:var(--muted);font-size:14px;margin:0 0 10px}
.ver{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 14px var(--sans);cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:38px}
.ver .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.ver.prog .dot{background:linear-gradient(90deg,var(--accent-text) 50%,transparent 50%);border-color:var(--accent-text)}
.ver.done .dot{background:var(--good);border-color:var(--good)}
.ver.cur{border-color:var(--ink);font-weight:700}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);box-shadow:var(--shadow);margin:14px 0}
.story{margin:0 0 10px}
dl.giv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;margin:0;border-top:1px solid var(--line)}
dl.giv dt,dl.giv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
dl.giv dt{color:var(--muted);padding-right:12px}
dl.giv dd{font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:560px){dl.giv{grid-template-columns:1fr}dl.giv dt{border-bottom:0;padding-bottom:0}dl.giv dd{padding-top:2px}}
.tw{overflow-x:auto;margin:6px -4px 0;padding:0 4px}
table.sch{border-collapse:collapse;width:100%;font:500 14px/1.35 var(--sans);font-variant-numeric:tabular-nums;min-width:440px}
table.sch th,table.sch td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.sch th{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.sch td:first-child,table.sch th:first-child{text-align:left;white-space:normal;min-width:150px}
table.sch td.q{color:var(--muted);font-family:var(--mono)}
table.sch td.f{background:var(--fill);font-weight:700}
table.sch td.new{animation:pop 1.2s ease-out}
@keyframes pop{0%{background:var(--accent-text);color:#fff}100%{}}
.cap{font:700 15px var(--sans);margin:0 0 4px}
.done-step{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface)}
.done-step summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:baseline}
.done-step summary::-webkit-details-marker{display:none}
.done-step .mk{font-weight:800;min-width:18px}.mk.ok{color:var(--good)}.mk.sh{color:var(--accent-text)}
.done-step .ans{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.done-step .body{padding:0 14px 12px}
.step{border:2px solid var(--ink);border-radius:16px;padding:16px;margin:14px 0;background:var(--surface)}
.learn{background:var(--learn-soft);border-left:4px solid var(--learn);border-radius:10px;padding:12px 14px;margin:10px 0 14px}
.learn b{display:block;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--learn);margin-bottom:4px}
.again{font-size:14px;color:var(--muted);margin:6px 0 10px}
.ask{font-weight:600;font-size:17px;margin:0 0 12px}
.inp{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);max-width:280px;min-height:48px}
.inp:focus-within{border-color:var(--ink)}
.inp span{color:var(--muted);font-weight:600}
.inp input{border:0;background:transparent;color:var(--ink);font:600 18px var(--mono);width:100%;padding:10px 0;outline:none;min-width:0}
.fu{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.fu button{appearance:none;border:0;background:var(--bg);color:var(--ink);font:600 14px var(--sans);padding:0 12px;min-height:44px;cursor:pointer}
.fu button+button{border-left:1.5px solid var(--line)}
.fu button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 14px;font:500 15px/1.4 var(--sans);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.acts{margin-top:14px}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.hint{background:var(--bg3);border:1px solid var(--line)}
.fb .h{font-weight:800;margin-bottom:4px}
ol.work{margin:6px 0 0;padding-left:22px}
ol.work li{margin:3px 0;font-variant-numeric:tabular-nums}
.why{margin:8px 0 0;font-size:15px}
.finish{border:2px solid var(--good);border-radius:16px;padding:18px;margin:16px 0;background:var(--good-soft)}
.pbar{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:10px 0 2px}
.pbar i{display:block;height:100%;background:var(--daybreak)}
.muted{color:var(--muted)}
.small{font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%}
.modal input{width:100%;font:500 17px var(--sans);padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:10px 0}
.hide{display:none}
</style></head><body>

<header class="top"><b class="brand">Managerial Accounting · Problems</b><div class="sp"></div><p class="me"><span id="whoLbl">Studying as</span> <b id="who"></b> <button class="linkbtn" id="switch">Switch</button> <span id="sync" class="small"></span></p></header>
<main id="app"></main>

<script>
const PROBLEMS=[{"id": "con-b8", "ch": "b8", "type": "concept", "title": "Budget basics", "ver": "Concepts", "story": "Before the numbers: what budgets are for and the different ways to make them.", "givens": [], "table": null, "parts": [{"t": "Why budget?", "ask": "Which is NOT one of the main benefits of preparing a budget?", "k": "mc", "learn": "A budget is a detailed plan for the future written in numbers. Planning = setting goals and deciding how to reach them. Controlling = comparing actual results with the plan to stay on track.", "steps": ["Budgets help plan, coordinate and evaluate.", "No budget can guarantee a profit."], "hint": "Which one is too good to be true?", "why": "", "opts": ["It guarantees the company will make a profit", "It forces managers to plan ahead", "It communicates plans and coordinates departments", "It gives a benchmark to judge performance against"]}, {"t": "Master budget", "ask": "The master budget is also called the…", "k": "mc", "learn": "The master budget is the full plan for the whole company at ONE planned level of activity. Because it's built for one volume, it's called static (it doesn't move) or the planning budget.", "steps": ["Master = static = planning budget."], "hint": "Static means it doesn't change.", "why": "", "opts": ["Static or planning budget", "Flexible budget", "Zero-based budget", "Rolling budget"]}, {"t": "Continuous budget", "ask": "A budget that always shows the next 12 months, adding a new month as each month ends, is a…", "k": "mc", "learn": "Continuous budget: always looking 12 months ahead. Zero-based: every manager starts at $0 and justifies every dollar. Participative: lower-level managers help create it.", "steps": ["Always 12 months ahead → continuous / rolling."], "hint": "It keeps rolling forward.", "why": "", "opts": ["Continuous (perpetual) budget, also called a rolling forecast", "Zero-based budget", "Participative budget", "Master budget"]}, {"t": "Zero-based budget", "ask": "In a zero-based budget, managers…", "k": "mc", "learn": "Zero-based budgeting stops managers from just adding a little to last year. Every expense has to earn its spot.", "steps": ["Start at $0 → justify everything."], "hint": "The name says it.", "why": "", "opts": ["Start from $0 and justify every dollar", "Copy last year's budget", "Let workers set their own budget", "Budget zero profit"]}, {"t": "Participative budget", "ask": "What is a disadvantage of a participative (self-imposed) budget?", "k": "mc", "learn": "In a participative budget, the managers who run day-to-day work help build it. Advantages: they know the details, so numbers are more realistic, and they're more motivated to hit a goal they set. Disadvantages: it takes longer, and they may pad it (budgetary slack) to make it easy to meet.", "steps": ["Slack = padding a budget so it's easy to beat."], "hint": "Why might a manager set an easy target?", "why": "", "opts": ["Managers may build slack into their budgets", "Managers are less motivated", "It uses less realistic numbers", "Top management does all the work"]}, {"t": "Order of budgets", "ask": "Which budget is prepared FIRST?", "k": "mc", "learn": "Almost everything depends on how much the company expects to sell, so the sales budget comes first. Order: sales → production (or purchases for a store) → materials, labor, overhead → S&A → cash budget → budgeted income statement → budgeted balance sheet.", "steps": ["Sales budget drives the rest."], "hint": "What do you need to know before deciding how much to make?", "why": "", "opts": ["Sales budget", "Cash budget", "Production budget", "Budgeted balance sheet"]}, {"t": "Manufacturer vs. store", "ask": "A store (merchandiser) does NOT need which budget?", "k": "mc", "learn": "A manufacturer makes products, so it needs production, materials, labor and overhead budgets. A merchandiser buys finished goods to resell, so it uses a purchases budget instead.", "steps": ["Stores buy, they don't produce."], "hint": "Does a store make anything?", "why": "", "opts": ["Production budget", "Sales budget", "Purchases budget", "Cash budget"]}], "goal": "The key terms in plain words"}, {"id": "sales-c", "ch": "b8", "type": "sales", "title": "Sales budget", "ver": "Course example (Trendy Totes)", "story": "Trendy Totes makes tote bags. Each tote bag is budgeted to sell for $25. The company is building its budget for the quarter April through June. Build the sales budget and split it into cash and credit sales.", "givens": [["Budgeted unit sales, April", "1,500 tote bags"], ["Budgeted unit sales, May", "1,600 tote bags"], ["Budgeted unit sales, June", "1,900 tote bags"], ["Selling price", "$25 per tote bag"], ["Cash sales", "10% of sales"], ["Credit sales (customers pay later)", "90% of sales"]], "table": {"title": "Sales Budget", "cols": ["", "April", "May", "June", "Quarter"], "rows": [["Budgeted units", "1,500", "1,600", "1,900", "#su"], ["× Selling price", "$25", "$25", "$25", "$25"], ["= Sales revenue", "#r1", "#r2", "#r3", "#rq"], ["Cash sales (10%)", "#c1", "#c2", "#c3", "#cq"], ["Credit sales (90%)", "#k1", "#k2", "#k3", "#kq"]]}, "parts": [{"t": "April sales revenue", "ask": "What is budgeted sales revenue for April? (1,500 tote bags at $25 each)", "k": "num", "learn": "A budget is a plan written in numbers. The sales budget is always made first, because almost every other budget (how much to make, how much material to buy, how much cash comes in) depends on how many tote bags the company expects to sell. Sales revenue is simply units × price.", "steps": ["Units × price = sales revenue", "1,500 × $25 = $37,500"], "hint": "Multiply the number of units by the selling price.", "why": "", "ans": 37500.0, "fmt": "$", "fills": {"r1": "$37,500"}}, {"t": "May and June sales revenue", "ask": "Same idea for June: what is budgeted sales revenue for June? (1,900 tote bags)", "k": "num", "learn": "", "steps": ["May: 1,600 × $25 = $40,000", "June: 1,900 × $25 = $47,500"], "hint": "Units × price again.", "why": "", "again": 1, "ans": 47500.0, "fmt": "$", "fills": {"r2": "$40,000", "r3": "$47,500"}}, {"t": "Quarter total", "ask": "What is total budgeted sales revenue for the whole quarter?", "k": "num", "learn": "A quarter is 3 months. The quarter column of a sales budget is just the three months added together. This total is the Sales line on the budgeted income statement.", "steps": ["$37,500 + $40,000 + $47,500 = $125,000", "Check: 5,000 total units × $25 = $125,000"], "hint": "Add the three months.", "why": "", "ans": 125000.0, "fmt": "$", "fills": {"rq": "$125,000", "su": "5,000"}}, {"t": "April cash sales", "ask": "10% of sales are cash sales. How much of April's sales are cash sales?", "k": "num", "learn": "Some customers pay right away (cash sales). Others buy on account, meaning they take the product now and pay later. That is a credit sale. It does NOT mean a credit card. Companies split sales this way because only the cash part arrives in the bank right away.", "steps": ["$37,500 × 10% = $3,750"], "hint": "Take 10% of April's sales revenue.", "why": "", "ans": 3750.0, "fmt": "$", "fills": {"c1": "$3,750", "c2": "$4,000", "c3": "$4,750", "cq": "$12,500"}}, {"t": "April credit sales", "ask": "What are April's credit sales (sales on account)?", "k": "num", "learn": "Credit sales are everything that is not a cash sale. If 10% is cash, then 90% is credit. You can multiply by 90% or subtract the cash sales from total sales.", "steps": ["$37,500 × 90% = $33,750", "Or: $37,500 − $3,750 cash = $33,750"], "hint": "Use 90%.", "why": "", "ans": 33750.0, "fmt": "$", "fills": {"k1": "$33,750"}}, {"t": "June credit sales", "ask": "What are June's credit sales?", "k": "num", "learn": "", "steps": ["May: $40,000 × 90% = $36,000", "June: $47,500 × 90% = $42,750", "Quarter credit sales: $112,500"], "hint": "June's revenue × 90%.", "why": "", "again": 1, "ans": 42750.0, "fmt": "$", "fills": {"k2": "$36,000", "k3": "$42,750", "kq": "$112,500"}}], "goal": "Units × price, then split into cash and credit sales"}, {"id": "sales-p1", "ch": "b8", "type": "sales", "title": "Sales budget", "ver": "Practice 1 (Peak Bottles)", "story": "Peak Bottles makes water bottles. Each water bottle is budgeted to sell for $24. The company is building its budget for the quarter January through March. Build the sales budget and split it into cash and credit sales.", "givens": [["Budgeted unit sales, January", "1,400 water bottles"], ["Budgeted unit sales, February", "1,900 water bottles"], ["Budgeted unit sales, March", "1,100 water bottles"], ["Selling price", "$24 per water bottle"], ["Cash sales", "20% of sales"], ["Credit sales (customers pay later)", "80% of sales"]], "table": {"title": "Sales Budget", "cols": ["", "January", "February", "March", "Quarter"], "rows": [["Budgeted units", "1,400", "1,900", "1,100", "#su"], ["× Selling price", "$24", "$24", "$24", "$24"], ["= Sales revenue", "#r1", "#r2", "#r3", "#rq"], ["Cash sales (20%)", "#c1", "#c2", "#c3", "#cq"], ["Credit sales (80%)", "#k1", "#k2", "#k3", "#kq"]]}, "parts": [{"t": "January sales revenue", "ask": "What is budgeted sales revenue for January? (1,400 water bottles at $24 each)", "k": "num", "learn": "A budget is a plan written in numbers. The sales budget is always made first, because almost every other budget (how much to make, how much material to buy, how much cash comes in) depends on how many water bottles the company expects to sell. Sales revenue is simply units × price.", "steps": ["Units × price = sales revenue", "1,400 × $24 = $33,600"], "hint": "Multiply the number of units by the selling price.", "why": "", "ans": 33600.0, "fmt": "$", "fills": {"r1": "$33,600"}}, {"t": "February and March sales revenue", "ask": "Same idea for March: what is budgeted sales revenue for March? (1,100 water bottles)", "k": "num", "learn": "", "steps": ["February: 1,900 × $24 = $45,600", "March: 1,100 × $24 = $26,400"], "hint": "Units × price again.", "why": "", "again": 1, "ans": 26400.0, "fmt": "$", "fills": {"r2": "$45,600", "r3": "$26,400"}}, {"t": "Quarter total", "ask": "What is total budgeted sales revenue for the whole quarter?", "k": "num", "learn": "A quarter is 3 months. The quarter column of a sales budget is just the three months added together. This total is the Sales line on the budgeted income statement.", "steps": ["$33,600 + $45,600 + $26,400 = $105,600", "Check: 4,400 total units × $24 = $105,600"], "hint": "Add the three months.", "why": "", "ans": 105600.0, "fmt": "$", "fills": {"rq": "$105,600", "su": "4,400"}}, {"t": "January cash sales", "ask": "20% of sales are cash sales. How much of January's sales are cash sales?", "k": "num", "learn": "Some customers pay right away (cash sales). Others buy on account, meaning they take the product now and pay later. That is a credit sale. It does NOT mean a credit card. Companies split sales this way because only the cash part arrives in the bank right away.", "steps": ["$33,600 × 20% = $6,720"], "hint": "Take 20% of January's sales revenue.", "why": "", "ans": 6720.0, "fmt": "$", "fills": {"c1": "$6,720", "c2": "$9,120", "c3": "$5,280", "cq": "$21,120"}}, {"t": "January credit sales", "ask": "What are January's credit sales (sales on account)?", "k": "num", "learn": "Credit sales are everything that is not a cash sale. If 20% is cash, then 80% is credit. You can multiply by 80% or subtract the cash sales from total sales.", "steps": ["$33,600 × 80% = $26,880", "Or: $33,600 − $6,720 cash = $26,880"], "hint": "Use 80%.", "why": "", "ans": 26880.0, "fmt": "$", "fills": {"k1": "$26,880"}}, {"t": "March credit sales", "ask": "What are March's credit sales?", "k": "num", "learn": "", "steps": ["February: $45,600 × 80% = $36,480", "March: $26,400 × 80% = $21,120", "Quarter credit sales: $84,480"], "hint": "March's revenue × 80%.", "why": "", "again": 1, "ans": 21120.0, "fmt": "$", "fills": {"k2": "$36,480", "k3": "$21,120", "kq": "$84,480"}}], "goal": "Units × price, then split into cash and credit s t", "ver": "Practice 3 (Trailhead Packs)", "story": "Trailhead Packs makes backpacks. Each backpack is budgeted to sell for $32. The company is building its budget for the quarter October through December. Build the sales budget and split it into cash and credit sales.", "givens": [["Budgeted unit sales, October", "3,300 backpacks"], ["Budgeted unit sales, November", "3,000 backpacks"], ["Budgeted unit sales, December", "2,300 backpacks"], ["Selling price", "$32 per backpack"], ["Cash sales", "10% of sales"], ["Credit sales (customers pay later)", "90% of sales"]], "table": {"title": "Sales Budget", "cols": ["", "October", "November", "December", "Quarter"], "rows": [["Budgeted units", "3,300", "3,000", "2,300", "#su"], ["× Selling price", "$32", "$32", "$32", "$32"], ["= Sales revenue", "#r1", "#r2", "#r3", "#rq"], ["Cash sales (10%)", "#c1", "#c2", "#c3", "#cq"], ["Credit sales (90%)", "#k1", "#k2", "#k3", "#kq"]]}, "parts": [{"t": "October sales revenue", "ask": "What is budgeted sales revenue for October? (3,300 backpacks at $32 each)", "k": "num", "learn": "A budget is a plan written in numbers. The sales budget is always made first, because almost every other budget (how much to make, how much material to buy, how much cash comes in) depends on how many backpacks the company expects to sell. Sales revenue is simply units × price.", "steps": ["Units × price = sales revenue", "3,300 × $32 = $105,600"], "hint": "Multiply the number of units by the selling price.", "why": "", "ans": 105600.0, "fmt": "$", "fills": {"r1": "$105,600"}}, {"t": "November and December sales revenue", "ask": "Same idea for December: what is budgeted sales revenue for December? (2,300 backpacks)", "k": "num", "learn": "", "steps": ["November: 3,000 × $32 = $96,000", "December: 2,300 × $32 = $73,600"], "hint": "Units × price again.", "why": "", "again": 1, "ans": 73600.0, "fmt": "$", "fills": {"r2": "$96,000", "r3": "$73,600"}}, {"t": "Quarter total", "ask": "What is total budgeted sales revenue for the whole quarter?", "k": "num", "learn": "A quarter is 3 months. The quarter column of a sales budget is just the three months added together. This total is the Sales line on the budgeted income statement.", "steps": ["$105,600 + $96,000 + $73,600 = $275,200", "Check: 8,600 total units × $32 = $275,200"], "hint": "Add the three months.", "why": "", "ans": 275200.0, "fmt": "$", "fills": {"rq": "$275,200", "su": "8,600"}}, {"t": "October cash sales", "ask": "10% of sales are cash sales. How much of October's sales are cash sales?", "k": "num", "learn": "Some customers pay right away (cash sales). Others buy on account, meaning they take the product now and pay later. That is a credit sale. It does NOT mean a credit card. Companies split sales this way because only the cash part arrives in the bank right away.", "steps": ["$105,600 × 10% = $10,560"], "hint": "Take 10% of October's sales revenue.", "why": "", "ans": 10560.0, "fmt": "$", "fills": {"c1": "$10,560", "c2": "$9,600", "c3": "$7,360", "cq": "$27,520"}}, {"t": "October credit sales", "ask": "What are October's credit sales (sales on account)?", "k": "num", "learn": "Credit sales are everything that is not a cash sale. If 10% is cash, then 90% is credit. You can multiply by 90% or subtract the cash sales from total sales.", "steps": ["$105,600 × 90% = $95,040", "Or: $105,600 − $10,560 cash = $95,040"], "hint": "Use 90%.", "why": "", "ans": 95040.0, "fmt": "$", "fills": {"k1": "$95,040"}}, {"t": "December credit sales", "ask": "What are December's credit sales?", "k": "num", "learn": "", "steps": ["November: $96,000 × 90% = $86,400", "December: $73,600 × 90% = $66,240", "Quarter credit sales: $247,680"], "hint": "December's revenue × 90%.", "why": "", "again": 1, "ans": 66240.0, "fmt": "$", "fills": {"k2": "$86,400", "k3": "$66,240", "kq": "$247,680"}}], "goal": "Units × price, then split into cash and credit sales"}, {"id": "collect-c", "ch": "b8", "type": "collect", "title": "Cash collections & accounts receivable", "ver": "Course example (Trendy Totes)", "story": "Trendy Totes makes tote bags. Each tote bag is budgeted to sell for $25. The company is building its budget for the quarter April through June. Customers who buy on account pay over three months. Figure out how much cash actually arrives each month and what customers still owe at the end.", "givens": [["Sales revenue, April", "$37,500"], ["Sales revenue, May", "$40,000"], ["Sales revenue, June", "$47,500"], ["Cash sales", "10% of sales (collected right away)"], ["Credit sales", "90% of sales"], ["Credit sales are collected", "40% in the month of sale, 50% the next month, 10% two months later"], ["Credit sales from March (last month, already happened)", "$40,500"], ["Credit sales from February (two months ago)", "$27,000"]], "table": {"title": "Schedule of Cash Collections", "cols": ["", "April", "May", "June"], "rows": [["Cash sales (10%)", "#a1", "#a2", "#a3"], ["40% of this month's credit sales", "#b1", "#b2", "#b3"], ["50% of last month's credit sales", "#c1", "#c2", "#c3"], ["10% of credit sales from 2 months ago", "#d1", "#d2", "#d3"], ["= Total cash collected", "#t1", "#t2", "#t3"]]}, "parts": [{"t": "April: cash sales", "ask": "How much cash comes in during April from April's cash sales?", "k": "num", "learn": "The sales budget says how much the company SELLS. The cash collections schedule says when the money actually ARRIVES. They are different because credit customers pay later. Cash sales are the easy part: that money arrives in the same month.", "steps": ["$37,500 × 10% = $3,750"], "hint": "Cash sales % × this month's sales.", "why": "", "ans": 3750.0, "fmt": "$", "fills": {"a1": "$3,750"}}, {"t": "April: this month's credit sales", "ask": "40% of credit sales are collected in the month of the sale. How much of April's credit sales is collected in April?", "k": "num", "learn": "Always do it in two steps: first turn sales into CREDIT sales (× 90%), then take the collection % (× 40%). A common mistake is multiplying total sales by 40% and skipping the credit step.", "steps": ["Credit sales for April: $37,500 × 90% = $33,750", "Collected now: $33,750 × 40% = $13,500"], "hint": "April's credit sales × 40%.", "why": "", "ans": 13500.0, "fmt": "$", "fills": {"b1": "$13,500"}}, {"t": "April: last month's credit sales", "ask": "50% of credit sales are collected the month after the sale. How much cash comes in during April from March's credit sales of $40,500?", "k": "num", "learn": "Customers who bought on account last month (March) are now paying their next piece. So April's cash includes money from an OLDER month's sales. Always look BACK in time, never forward: May's sales have not happened yet, so they cannot be collected in April.", "steps": ["$40,500 × 50% = $20,250"], "hint": "Use March's credit sales, not April's.", "why": "", "ans": 20250.0, "fmt": "$", "fills": {"c1": "$20,250"}}, {"t": "April: credit sales from two months ago", "ask": "The last 10% is collected two months after the sale. How much comes in during April from February's credit sales of $27,000?", "k": "num", "learn": "Each credit sale gets paid in pieces: 40% + 50% + 10% = 100%. The final 10% shows up two months later. After that, that month's sales are fully collected.", "steps": ["$27,000 × 10% = $2,700"], "hint": "February's credit sales × 10%.", "why": "", "ans": 2700.0, "fmt": "$", "fills": {"d1": "$2,700"}}, {"t": "April: total cash collected", "ask": "Add it up. What are total budgeted cash collections for April?", "k": "num", "learn": "Total collections for a month = this month's cash sales + every piece of credit sales that happens to be due this month.", "steps": ["$3,750 + $13,500 + $20,250 + $2,700 = $40,200"], "hint": "Add the four lines in the column.", "why": "", "ans": 40200.0, "fmt": "$", "fills": {"t1": "$40,200"}}, {"t": "May: total cash collected", "ask": "Now do May on your own. What are total cash collections for May? (Hint: 'last month' is now April, and 'two m", "learn": "Just like finished goods, the company keeps a cushion of raw materials so production next month doesn't stop. The cushion is a % of NEXT month's materials needed for production (November: 2,930 × 4 = 11,720 yards).", "steps": ["November needs: 2,930 × 4 = 11,720 yards", "11,720 × 10% = 1,172 yards"], "hint": "Use November's production needs.", "why": "", "ans": 1172.0, "fmt": "u", "fills": {"e1": "1,172"}}, {"t": "October: yards to buy", "ask": "There are 1,308 yards on hand at the start of October. How many yards must be purchased in October?", "k": "num", "learn": "Same pattern as the production budget: Needed for production + Desired ending − Beginning = Amount to purchase.", "steps": ["13,080 + 1,172 − 1,308 = 12,944 yards"], "hint": "Needed + ending − beginning.", "why": "", "ans": 12944.0, "fmt": "u", "fills": {"b1": "1,308", "y1": "12,944"}}, {"t": "October: cost of purchases", "ask": "What is the dollar cost of October's nylon purchases?", "k": "num", "learn": "The budget so far is in yards. To know how much money is needed, multiply by the cost per yard.", "steps": ["12,944 yards × $2 = $25,888"], "hint": "Yards to buy × cost per yard.", "why": "", "ans": 25888.0, "fmt": "$", "fills": {"d1": "$25,888"}}, {"t": "November: cost of purchases", "ask": "Do November start to finish. What is the cost of November's purchases? (Beginning nylon = October's ending, 1,172 yards.)", "k": "num", "learn": "", "steps": ["Needed: 2,930 × 4 = 11,720", "Ending: 10% × 9,520 (December needs) = 952", "Buy: 11,720 + 952 − 1,172 = 11,500 yards", "Cost: 11,500 × $2 = $23,000"], "hint": "Four steps: needed, ending, subtract beginning, × cost.", "why": "", "again": 1, "ans": 23000.0, "fmt": "$", "fills": {"n2": "11,720", "e2": "952", "b2": "1,172", "y2": "11,500", "d2": "$23,000"}}, {"t": "December: cost of purchases", "ask": "What is the cost of December's purchases? (January production is 3,180 backpacks.)", "k": "num", "learn": "", "steps": ["Needed: 2,380 × 4 = 9,520", "Ending: 10% × (3,180 × 4 = 12,720) = 1,272", "Buy: 9,520 + 1,272 − 952 = 9,840 yards", "Cost: 9,840 × $2 = $19,680"], "hint": "Ending materials uses January's production.", "why": "", "again": 1, "ans": 19680.0, "fmt": "$", "fills": {"n3": "9,520", "e3": "1,272", "b3": "952", "y3": "9,840", "d3": "$19,680"}}], "goal": "Production × material per unit, plus a cushion, minus what's on hand"}, {"id": "pay-c", "ch": "b8", "type": "pay", "title": "Cash payments for materials & accounts payable", "ver": "Course example (Trendy Totes)", "story": "Trendy Totes makes tote bags. Each tote bag is budgeted to sell for $25. The company is building its budget for the quarter April through June. Suppliers are paid over three months. Figure out how much cash goes out each month for materials and what is still owed at the end.", "givens": [["Material purchases: April", "$9,096"], ["Material purchases: May", "$9,864"], ["Material purchases: June", "$11,481"], ["Material purchases: March (last month)", "$10,542"], ["Material purchases: February (two months ago)", "$7,713"], ["Payment pattern", "60% in the month of purchase, 30% the next month, 10% two months later"]], "table": {"title": "Cash Payments for Materials", "cols": ["", "April", "May", "June"], "rows": [["60% of this month's purchases", "#a1", "#a2", "#a3"], ["30% of last month's purchases", "#b1", "#b2", "#b3"], ["10% of purchases from 2 months ago", "#c1", "#c2", "#c3"], ["= Total paid", "#t1", "#t2", "#t3"]]}, "parts": [{"t": "April: this month's purchases", "ask": "60% of purchases are paid in the month of purchase. How much is paid in April for April's purchases of $9,096?", "k": "num", "learn": "Companies usually buy materials on account too, meaning they get the materials now and pay the supplier later. This schedule is the mirror image of cash collections: instead of customers paying us, we are paying suppliers in pieces.", "steps": ["$9,096 × 60% = $5,457.60"], "hint": "60% of April's purchases.", "why": "", "ans": 5457.6, "fmt": "$", "fills": {"a1": "$5,457.60"}}, {"t": "April: older purchases", "ask": "How much is paid in April for OLDER purchases? (30% of March's $10,542 plus 10% of February's $7,713)", "k": "num", "learn": "Look back in time, like collections. Last month's purchase gets its second payment now, and the purchase from two months ago gets its final payment.", "steps": ["$10,542 × 30% = $3,162.60", "$7,713 × 10% = $771.30", "Together: $3,933.90"], "hint": "Two pieces, add them.", "why": "", "ans": 3933.9, "fmt": "$", "fills": {"b1": "$3,162.60", "c1": "$771.30"}}, {"t": "April: total paid", "ask": "What is the total cash paid for materials in April?", "k": "num", "learn": "", "steps": ["$5,457.60 + $3,162.60 + $771.30 = $9,391.50"], "hint": "Add the three lines.", "why": "", "ans": 9391.5, "fmt": "$", "fills": {"t1": "$9,391.50"}}, {"t": "May: total paid", "ask": "What is the total cash paid for materials in May?", "k": "num", "learn": "", "steps": ["60% × $9,864 = $5,918.40", "30% × $9,096 = $2,728.80", "10% × $10,542 = $1,054.20", "Total = $9,701.40"], "hint": "Same three pieces, each moved forward one month.", "why": "", "again": 1, "ans": 9701.4, "fmt": "$", "fills": {"a2": "$5,918.40", "b2": "$2,728.80", "c2": "$1,054.20", "t2": "$9,701.40"}}, {"t": "June: total paid", "ask": "What is the total cash paid for materials in June?", "k": "num", "learn": "", "steps": ["60% × $11,481 = $6,888.60", "30% × $9,864 = $2,959.20", "10% × $9,096 = $909.60", "Total = $10,757.40"], "hint": "Use June, May and April purchases.", "why": "", "again": 1, "ans": 10757.4, "fmt": "$", "fills": {"a3": "$6,888.60", "b3": "$2,959.20", "c3": "$909.60", "t3": "$10,757.40"}}, {"t": "Accounts payable at the end of June", "ask": "Accounts payable is money the company still owes suppliers. What is the accounts payable balance at the end of June?", "k": "num", "learn": "Accounts payable (A/P) is what has NOT been paid yet. At the end of June: 40% of June's purchases is still unpaid (only 60% was paid), and 10% of May's purchases is still unpaid.", "steps": ["June: $11,481 × 40% = $4,592.40", "May: $9,864 × 10% = $986.40", "A/P = $5,578.80"], "hint": "Unpaid part of the last two months.", "why": "A/P goes on the budgeted balance sheet as a liability.", "ans": 5578.8, "fmt": "$"}], "goal": "When material purchases are paid, and what is still owed (A/P)"}, {"id": "pay-p1", "ch": "b8", "type": "pay", "title": "Cash payments for materials & accounts payable", "ver": "Practice 1 (Peak Bottles)", "story": "Peak Bottles makes water bottles. Each water bottle is budgeted to sell for $24. The company is building its budget for the quarter January through March. Suppliers are paid over three months. Figure out how much cash goes out each month for materials and what is still owed at the end.", "givens": [["Material purchases: January", "$11,896"], ["Material purchases: February", "$14,016"], ["Material purchases: March", "$9,384"], ["Material purchases: December (last month)", "$14,816"], ["Material purchases: November (two months ago)", "$10,428"], ["Payment pattern", "50% in the month of purchase, 40% the next month, 10% two months later"]], "table": {"title": "Cash Payments for Materials", "cols": ["", "January", "February", "March"], "rows": [["50% of this month's purchases", "#a1", "#a2", "#a3"], ["40% of last month's purchases", "#b1", "#b2", "#b3"], ["10% of purchases from 2 months ago", "#c1", "#c2", "#c3"], ["= Total paid", "#t1", "#t2", "#t3"]]}, "parts": [{"t": "January: this month's purchases", "ask": "50% of purchases are paid in the month of purchase. How much is paid in January for January's purchases of $11,896?", "k": "num", "learn": "Companies usually buy materials on account too, meaning they get the materials now and pay the supplier later. This schedule is the mirror image of cash collections: instead of customers paying us, we are paying suppliers in pieces.", "steps": ["$11,896 × 50% = $5,948"], "hint": "50% of January's purchases.", rable (U) means income ends up LOWER: less revenue, or more cost.", "steps": ["Less cost → more income → F."], "hint": "Ask: does income go up or down?", "why": "", "opts": ["Favorable, because spending less than budgeted makes income higher", "Unfavorable, because actual is different from budget", "Unfavorable, because the company spent less on advertising", "Neither, fixed costs have no variances"]}, {"t": "Revenue variance", "ask": "Actual sales were $135,000; the budget was $150,000. The variance is…", "k": "mc", "learn": "For revenue, less than planned is unfavorable.", "steps": ["$150,000 − $135,000 = $15,000; less revenue → U"], "hint": "Less revenue hurts income.", "why": "", "opts": ["$15,000 U", "$15,000 F", "$135,000 U", "$285,000 F"]}, {"t": "Management by exception", "ask": "Management by exception means…", "k": "mc", "learn": "Managers have limited time, so they only dig into variances that are big (over some dollar or % threshold).", "steps": ["Small variances are normal; big ones get attention."], "hint": "Exceptions = unusual items.", "why": "", "opts": ["Only investigating large variances", "Investigating every variance", "Ignoring unfavorable variances", "Letting managers skip budgeting"]}, {"t": "Flexible budget", "ask": "A flexible budget shows…", "k": "mc", "learn": "The master budget is set before the period at one planned volume. The flexible budget is built after, at the actual volume, using the same prices and per-unit costs. It's used to judge performance fairly.", "steps": ["Flexible = budgeted rates × actual activity."], "hint": "It 'flexes' to actual volume.", "why": "", "opts": ["What revenues and costs should have been at the ACTUAL level of activity", "Actual revenues and costs", "The plan at the expected level of activity", "Costs that can be cut"]}, {"t": "Activity variance", "ask": "The activity (volume) variance compares…", "k": "mc", "learn": "Variance map: Master budget variance = actual vs. master. It splits into: Spending (revenue/flexible budget) variance = actual vs. flexible, and Activity variance = flexible vs. master.", "steps": ["Only difference between flexible and master is volume → activity variance."], "hint": "Which two are both budgets?", "why": "", "opts": ["Flexible budget with the master budget", "Actual results with the flexible budget", "Actual results with the master budget", "Last year with this year"]}, {"t": "Spending variance", "ask": "The revenue/spending variance (flexible budget variance) is caused by…", "k": "mc", "learn": "Actual and flexible are at the same volume, so whatever difference is left is from prices, rates and efficiency.", "steps": ["Same volume → difference is from prices/costs."], "hint": "Volume is held equal.", "why": "", "opts": ["Prices and costs being different from plan, not volume", "Selling more units than planned", "Fixed costs changing with volume", "Errors in the master budget"]}], "goal": "The key terms in plain words"}, {"id": "flex-c", "ch": "f9", "type": "flex", "title": "Flexible budget & performance report", "ver": "Course example (Trendy Totes)", "story": "Trendy Totes sells bags. It planned to sell 5,000 but actually sold 6,000. Build the flexible budget and split the difference from plan into activity and spending variances.", "givens": [["Master (planned) budget volume", "5,000 bags"], ["Actual volume sold", "6,000 bags"], ["Budgeted selling price", "$25 per bag"], ["Budgeted direct materials (variable)", "$6 per bag"], ["Budgeted direct labor (variable)", "$5 per bag"], ["Budgeted manufacturing overhead (variable)", "$4 per bag"], ["Budgeted sales commissions (variable)", "$2 per bag"], ["Budgeted shipping (variable)", "$0.50 per bag"], ["Budgeted depreciation (fixed)", "$1,500 per month"], ["Budgeted administrative salaries (fixed)", "$6,000 per month"], ["Budgeted advertising (fixed)", "$1,500 per month"], ["Actual sales revenue", "$135,000"], ["Actual direct materials", "$33,600"], ["Actual direct labor", "$36,000"], ["Actual manufacturing overhead", "$24,000"], ["Actual sales commissions", "$12,000"], ["Actual shipping", "$3,600"], ["Actual depreciation", "$1,500"], ["Actual administrative salaries", "$6,000"], ["Actual advertising", "$1,000"]], "table": {"title": "Performance Report", "cols": ["", "Actual", "Spending var.", "Flexible budget", "Activity var.", "Master budget"], "rows": [["Units", "6,000", "", "6,000", "", "5,000"], ["Sales revenue", "$135,000", "#rs", "#fr", "#ra", "$125,000"], ["Direct materials", "$33,600", "#s_0", "#f_0", "#a_0", "$30,000"], ["Direct labor", "$36,000", "#s_1", "#f_1", "#a_1", "$25,000"], ["Manufacturing overhead", "$24,000", "#s_2", "#f_2", "#a_2", "$20,000"], ["Sales commissions", "$12,000", "#s_3", "#f_3", "#a_3", "$10,000"], ["Shipping", "$3,600", "#s_4", "#f_4", "#a_4", "$2,500"], ["Depreciation", "$1,500", "#sf_0", "#ff_0", "None", "$1,500"], ["Administrative salaries", "$6,000", "#sf_1", "#ff_1", "None", "$6,000"], ["Advertising", "$1,000", "#sf_2", "#ff_2", "None", "$1,500"], ["Operating income", "$17,300", "#os", "#fo", "#oa", "$28,500"]]}, "parts": [{"t": "Why a flexible budget?", "ask": "The master budget planned for 5,000 bags, but 6,000 were actually sold. Why is comparing actual results straight to the master budget misleading?", "k": "mc", "learn": "A variance is the difference between actual results and the budget. It is favorable (F) if it makes income HIGHER than planned (more revenue or less cost) and unfavorable (U) if it makes income LOWER. But if more units were sold than planned, of course materials cost more. That isn't bad management. A flexible budget fixes this.", "steps": ["Flexible budget = what revenue and costs SHOULD have been at the ACTUAL volume.", "It uses the master budget's prices and per-unit costs, just with actual units."], "hint": "Think apples to oranges.", "why": "", "opts": ["The two are based on different volumes, so costs are bound to differ just because more or fewer units were sold", "The master budget always has math errors", "Actual results ignore fixed costs", "Revenue can't be compared, only costs"]}, {"t": "Flexible budget revenue", "ask": "What should revenue have been for 6,000 bags at the budgeted price?", "k": "num", "learn": "Flexible revenue = budgeted price × ACTUAL units. Budgeted price, because the flexible budget is still a budget; actual units, because it adjusts to what really happened.", "steps": ["$25 × 6,000 = $150,000"], "hint": "Budgeted price × actual units.", "why": "", "ans": 150000.0, "fmt": "$", "fills": {"fr": "$150,000"}}, {"t": "Flexible budget direct materials", "ask": "Direct materials is budgeted at $6 per bag. What is flexible budget direct materials?", "k": "num", "learn": "A variable cost changes with volume, so in the flexible budget it is budgeted cost per unit × actual units.", "steps": ["$6 × 6,000 = $36,000"], "hint": "Budgeted cost per unit × actual units.", "why": "", "ans": 36000.0, "fmt": "$", "fills": {"f_0": "$36,000", "f_1": "$30,000", "f_2": "$24,000", "f_3": "$12,000", "f_4": "$3,000"}}, {"t": "Flexible budget advertising", "ask": "Advertising is a fixed cost budgeted at $1,500. What is it in the flexible budget?", "k": "num", "learn": "A fixed cost doesn't change with volume (in the normal range), so the flexible budget shows the SAME amount as the master budget.", "steps": ["Fixed costs stay at $1,500 no matter how many units are sold."], "hint": "Fixed means it doesn't move with units.", "why": "", "ans": 1500.0, "fmt": "$", "fills": {"ff_0": "$1,500", "ff_1": "$6,000", "ff_2": "$1,500"}}, {"t": "Flexible budget operating income", "ask": "What is flexible budget operating income?", "k": "num", "learn": "Operating income = revenue − all costs.", "steps": ["Revenue $150,000 − variable costs $105,000 − fixed costs $9,000 = $36,000"], "hint": "Flexible revenue − all flexible costs.", "why": "", "ans": 36000.0, "fmt": "$", "fills": {"fo": "$36,000"}}, {"t": "Revenue: activity variance", "ask": "The activity variance compares the flexible budget with the master budget. What is the activity variance for revenue?", "k": "var", "learn": "Activity (volume) variance = flexible budget vs. master budget. The two budgets use the same prices, so the ONLY reason they differ is the number of units. For revenue: more units than planned is favorable. For costs: more units means more expected cost, so it's unfavorable (even though that's normal).", "steps": ["$150,000 flexible − $125,000 master = $25,000", "Flexible revenue is higher than planned → F"], "hint": "Flexible − master. More revenue = F.", "why": "", "ans": 25000.0, "fmt": "$", "fu": "F", "fills": {"ra": "$25,000 F"}}, {"t": "Revenue: spending variance", "ask": "The revenue (spending) variance compares actual results with the flexible budget. What is the revenue variance?", "k": "var", "learn": "Revenue/spending variance (also called the flexible budget variance) = actual vs. flexible budget. Both are at the same volume, so this variance shows what happened because of PRICES and COSTS, not volume.", "steps": ["$135,000 actual − $150,000 flexible = ($15,000)", "Actual revenue is lower → U"], "hint": "Actual − flexible.", "why": "That means the average actual selling price was $22.50, not $25.", "ans": 15000.0, "fmt": "$", "fu": "U", "fills": {"rs": "$15,000 U"}}, {"t": "Direct materials: spending variance", "ask": "What is the spending variance for direct materials?", "k": "var", "learn": "For a COST, spending more than the flexible budget is unfavorable; spending less is favorable.", "steps": ["$33,600 actual − $36,000 flexible = ($2,400)", "Actual cost is lower → F"], "hint": "Compare actual with flexible; for costs, more = U.", "why": "", "ans": 2400.0, "fmt": "$", "fu": "F", "fills": {"s_0": "$2,400 F", "s_1": "$6,000 U", "s_2": "None", "s_3": "None", "s_4": "$600 U", "sf_0": "None", "sf_1": "None", "sf_2": "$500 F"}}, {"t": "Direct materials: activity variance", "ask": "What is the activity variance for direct materials?", : "Performance Report", "cols": ["", "Actual", "Spending var.", "Flexible budget", "Activity var.", "Master budget"], "rows": [["Units", "11,000", "", "11,000", "", "12,000"], ["Sales revenue", "$101,200", "#rs", "#fr", "#ra", "$108,000"], ["Direct materials", "$25,300", "#s_0", "#f_0", "#a_0", "$28,800"], ["Direct labor", "$18,700", "#s_1", "#f_1", "#a_1", "$19,200"], ["Shipping", "$6,050", "#s_2", "#f_2", "#a_2", "$6,000"], ["Depreciation", "$6,000", "#sf_0", "#ff_0", "None", "$6,000"], ["Utilities", "$3,400", "#sf_1", "#ff_1", "None", "$3,000"], ["Operating income", "$41,750", "#os", "#fo", "#oa", "$45,000"]]}, "parts": [{"t": "Why a flexible budget?", "ask": "The master budget planned for 12,000 crates, but 11,000 were actually sold. Why is comparing actual results straight to the master budget misleading?", "k": "mc", "learn": "A variance is the difference between actual results and the budget. It is favorable (F) if it makes income HIGHER than planned (more revenue or less cost) and unfavorable (U) if it makes income LOWER. But if more units were sold than planned, of course materials cost more. That isn't bad management. A flexible budget fixes this.", "steps": ["Flexible budget = what revenue and costs SHOULD have been at the ACTUAL volume.", "It uses the master budget's prices and per-unit costs, just with actual units."], "hint": "Think apples to oranges.", "why": "", "opts": ["The two are based on different volumes, so costs are bound to differ just because more or fewer units were sold", "The master budget always has math errors", "Actual results ignore fixed costs", "Revenue can't be compared, only costs"]}, {"t": "Flexible budget revenue", "ask": "What should revenue have been for 11,000 crates at the budgeted price?", "k": "num", "learn": "Flexible revenue = budgeted price × ACTUAL units. Budgeted price, because the flexible budget is still a budget; actual units, because it adjusts to what really happened.", "steps": ["$9 × 11,000 = $99,000"], "hint": "Budgeted price × actual units.", "why": "", "ans": 99000.0, "fmt": "$", "fills": {"fr": "$99,000"}}, {"t": "Flexible budget direct materials", "ask": "Direct materials is budgeted at $2.40 per crate. What is flexible budget direct materials?", "k": "num", "learn": "A variable cost changes with volume, so in the flexible budget it is budgeted cost per unit × actual units.", "steps": ["$2.40 × 11,000 = $26,400"], "hint": "Budgeted cost per unit × actual units.", "why": "", "ans": 26400.0, "fmt": "$", "fills": {"f_0": "$26,400", "f_1": "$17,600", "f_2": "$5,500"}}, {"t": "Flexible budget utilities", "ask": "Utilities is a fixed cost budgeted at $3,000. What is it in the flexible budget?", "k": "num", "learn": "A fixed cost doesn't change with volume (in the normal range), so the flexible budget shows the SAME amount as the master budget.", "steps": ["Fixed costs stay at $3,000 no matter how many units are sold."], "hint": "Fixed means it doesn't move with units.", "why": "", "ans": 3000.0, "fmt": "$", "fills": {"ff_0": "$6,000", "ff_1": "$3,000"}}, {"t": "Flexible budget operating income", "ask": "What is flexible budget operating income?", "k": "num", "learn": "Operating income = revenue − all costs.", "steps": ["Revenue $99,000 − variable costs $49,500 − fixed costs $9,000 = $40,500"], "hint": "Flexible revenue − all flexible costs.", "why": "", "ans": 40500.0, "fmt": "$", "fills": {"fo": "$40,500"}}, {"t": "Revenue: activity variance", "ask": "The activity variance compares the flexible budget with the master budget. What is the activity variance for revenue?", "k": "var", "learn": "Activity (volume) variance = flexible budget vs. master budget. The two budgets use the same prices, so the ONLY reason they differ is the number of units. For revenue: more units than planned is favorable. For costs: more units means more expected cost, so it's unfavorable (even though that's normal).", "steps": ["$99,000 flexible − $108,000 master = ($9,000)", "Flexible revenue is lower than planned → U"], "hint": "Flexible − master. More revenue = F.", "why": "", "ans": 9000.0, "fmt": "$", "fu": "U", "fills": {"ra": "$9,000 U"}}, {"t": "Revenue: spending variance", "ask": "The revenue (spending) variance compares actual results with the flexible budget. What is the revenue variance?", "k": "var", "learn": "Revenue/spending variance (also called the flexible budget variance) = actual vs. flexible budget. Both are at the same volume, so this variance shows what happened because of PRICES and COSTS, not volume.", "steps": ["$101,200 actual − $99,000 flexible = $2,200", "Actual revenue is higher → F"], "hint": "Actual − flexible.", "why": "That means the average actual selling price was $9.20, not $9.", "ans": 2200.0, "fmt": "$", "fu": "F", "fills": {"rs": "$2,200 F"}}, {"t": "Direct materials: spending variance", "ask": "What is the spending variance for direct materials?", "k": "var", "learn": "For a COST, spending more than the flexible budget is unfavorable; spending less is favorable.", "steps": ["$25,300 actual − $26,400 flexible = ($1,100)", "Actual cost is lower → F"], "hint": "Compare actual with flexible; for costs, more = U.", "why": "", "ans": 1100.0, "fmt": "$", "fu": "F", "fills": {"s_0": "$1,100 F", "s_1": "$1,100 U", "s_2": "$550 U", "sf_0": "None", "sf_1": "$400 U"}}, {"t": "Direct materials: activity variance", "ask": "What is the activity variance for direct materials?", "k": "var", "learn": "", "steps": ["$26,400 flexible − $28,800 master = ($2,400)", "Fewer units → less expected cost → F"], "hint": "Flexible − master; for costs, higher = U.", "why": "", "ans": 2400.0, "fmt": "$", "fu": "F", "fills": {"a_0": "$2,400 F", "a_1": "$1,600 F", "a_2": "$500 F"}}, {"t": "Operating income: both variances", "ask": "What is the spending variance for operating income?", "k": "var", "learn": "For operating income, higher is favorable.", "steps": ["Actual OI $41,750 − flexible OI $40,500 = $1,250 → F", "Activity variance for OI: $40,500 − $45,000 = ($4,500) → U"], "hint": "Actual OI vs. flexible OI.", "why": "", "ans": 1250.0, "fmt": "$", "fu": "F", "fills": {"os": "$1,250 F", "oa": "$4,500 U"}}, {"t": "Master budget variance", "ask": "Spending variance + activity variance = master budget variance. What is the master budget variance for operating income?", "k": "var", "learn": "The master budget variance (actual vs. master) is the total. Splitting it tells managers how much came from volume (activity) and how much from prices and costs (spending).", "steps": ["Direct: $41,750 actual − $45,000 master = ($3,250)", "Check: $1,250 F + $4,500 U gives the same total (an F and a U offset each other)."], "hint": "Actual OI − master OI.", "why": "", "ans": 3250.0, "fmt": "$", "fu": "U"}], "goal": "Flexible budget at actual volume; activity vs. spending variances"}, {"id": "fill-p1", "ch": "f9", "type": "fill", "title": "Fill-in-the-blanks performance report", "ver": "Practice 1 (Newton Industries)", "story": "Newton Industries's performance report is missing numbers. Use the variances to work backward to the flexible budget, then rebuild the master budget.", "givens": [["Actual units sold", "28,000"], ["Master budget units", "31,800"], ["Actual sales revenue", "$224,000"], ["Actual variable expenses", "$168,000"], ["Actual fixed expenses", "$22,000"], ["Revenue (spending) variance on sales", "$14,000 F"], ["Spending variance on variable expenses", "$7,000 F"], ["Spending variance on fixed expenses", "$2,000 F"]], "table": {"title": "Performance Report (fill in the blanks)", "cols": ["", "Actual", "Spending var.", "Flexible budget", "Activity var.", "Master budget"], "rows": [["Units", "28,000", "", "28,000", "", "31,800"], ["Sales revenue", "$224,000", "$14,000 F", "#fr", "#ar", "#mr"], ["Variable expenses", "$168,000", "$7,000 F", "#fv", "#av", "#mv"], ["Contribution margin", "$56,000", "", "#fcm", "", "#mcm"], ["Fixed expenses", "$22,000", "$2,000 F", "#fc", "None", "#mc"], ["Operating income", "$34,000", "", "#foi", "#aoi", "#moi"]]}, "parts": [{"t": "Flexible budget revenue", "ask": "Back out the flexible budget. What is flexible budget sales revenue?", "k": "num", "learn": "In a fill-in report, work from what you know. Spending variance = actual − flexible, so flexible = actual ∓ the variance. A FAVORABLE revenue variance means actual was HIGHER than flexible, so subtract it. An UNFAVORABLE one means actual was lower, so add it.", "steps": ["Revenue variance is $14,000 F: actual was higher than flexible", "Flexible = $224,000 − $14,000 = $210,000"], "hint": "F on revenue → actual is bigger → subtract.", "why": "", "ans": 210000.0, "fmt": "$", "fills": {"fr": "$210,000"}}, {"t": "Budgeted price per unit", "ask": "The flexible budget uses the budgeted price × actual units (28,000). What is the budgeted price per unit?", "k": "num", "learn": "Once you have a flexible budget total, divide by actual units to get the per-unit budget amount. That per-unit number lets you rebuild the master budget.", "steps": ["$210,000 ÷ 28,000 = $7.50 per unit"], "hint": "Flexible revenue ÷ actual units.", "why": "", "ans": 7.5, "fmt": "$"}, {"t": "Flexible variable expenses", "ask": "What are flexible budget variable expenses?", "k": "num", "learn": "For a cost, an UNFAVORABLE variance means actual was HIGHER than flexible, so subtract to get back to flexible. FAVORABLE means actual was lower, so add.", "steps": ["Variance $7,000 F: actual was lower", "Flexible = $168,000 + $7,000 = $175,000", "Per unit: $175,000 ÷ 28,000 = $6.25"], "hint": "U on a cost → actual is bigger → subtract.", "why": "", "ans": 175000.0, "fmt": "$", "fills": {"fv": "$175,000", "fcm": "$35,000"}}, {"t": "Flexible fixed expenses", "ask": "What are flexible budget fixed expenses?", "k": "num", "learn": "Fixed costs don't change with volume, so whatever you find for the flexible budget is also the master budget amount.", "steps": ["$22,000 + $2,000 = $24,000", "Fixed costs are the same in the flexible and master bu s (no waste, no breakdowns), which almost nobody hits. Practical standards allow normal inefficiency, so workers can reasonably meet them.", "steps": ["Allows normal waste → practical/attainable."], "hint": "Which one can people actually reach?", "why": "", "opts": ["Practical (attainable) standards", "Ideal (perfection) standards", "Flexible standards", "Static standards"]}, {"t": "Standard cost per unit", "ask": "Standard cost per unit equals…", "k": "mc", "learn": "Example: 2 yards of canvas × $3.00 per yard = $6.00 of materials per bag.", "steps": ["Quantity × price, both standard."], "hint": "How much × how much each.", "why": "", "opts": ["Standard quantity per unit × standard price per unit of input", "Actual quantity × actual price", "Total budgeted cost ÷ actual units", "Standard price ÷ standard quantity"]}, {"t": "Price variance quantity", "ask": "The materials price variance uses which quantity?", "k": "mc", "learn": "Price variance = |AP − SP| × quantity purchased. Quantity variance = |quantity used − standard quantity allowed| × SP.", "steps": ["Price happens when you buy."], "hint": "When is the price set?", "why": "", "opts": ["Actual quantity PURCHASED", "Actual quantity used", "Standard quantity allowed", "Budgeted quantity in the master budget"]}, {"t": "Standard quantity allowed", "ask": "Standard quantity allowed (STQ) is based on…", "k": "mc", "learn": "STQ = standard quantity per unit × units ACTUALLY produced. It's how much should have been used for the work actually done.", "steps": ["Use actual units produced."], "hint": "Fair comparison = same output.", "why": "", "opts": ["Units actually produced", "Units in the master budget", "Units sold", "Materials purchased"]}, {"t": "Cheap materials", "ask": "A company buys cheaper, lower-quality materials. What pattern is most likely?", "k": "mc", "learn": "Variances trade off. Cheap materials cost less per unit (F price) but often break or get wasted, so more is used (U quantity). They can also slow workers down (U labor efficiency).", "steps": ["Saved on price, lost on waste."], "hint": "What happens to waste?", "why": "", "opts": ["Price variance F, quantity variance U", "Price variance U, quantity variance F", "Both F", "Both U"]}, {"t": "Labor variance names", "ask": "For direct labor, the price-type variance and the quantity-type variance are called…", "k": "mc", "learn": "Same formulas as materials, new names: rate variance = |actual rate − standard rate| × actual hours; efficiency variance = |actual hours − standard hours allowed| × standard rate.", "steps": ["Labor: rate + efficiency."], "hint": "Pay per hour, and speed.", "why": "", "opts": ["Rate variance and efficiency variance", "Price variance and quantity variance", "Spending variance and activity variance", "Volume variance and budget variance"]}], "goal": "The key terms in plain words"}, {"id": "dmv-c", "ch": "s10", "type": "dmv", "title": "Direct materials price & quantity variances", "ver": "Course example (Trendy Totes)", "story": "Trendy Totes makes bags using canvas. Compare what it actually paid and used with its standards.", "givens": [["Standard canvas per bag", "2 yards"], ["Standard price", "$3 per yard"], ["Bags actually produced", "6,000"], ["Canvas purchased", "11,000 yards at $3.20 per yard (total $35,200)"], ["Canvas used in production", "10,500 yards"]], "table": {"title": "Direct Materials Variances", "cols": ["", "Amount"], "rows": [["Standard quantity allowed (STQ)", "#stq"], ["Price variance", "#pv"], ["Quantity variance", "#qv"]]}, "parts": [{"t": "Standard cost per unit", "ask": "What is the standard direct materials cost for ONE bag?", "k": "num", "learn": "A standard is the planned amount: how much material SHOULD go into one unit and what it SHOULD cost. Standard cost per unit = standard quantity × standard price. Variances compare what really happened with these standards.", "steps": ["2 yards × $3 = $6"], "hint": "Standard quantity × standard price.", "why": "", "an nt (division, store, department).", "steps": ["Decisions are spread out."], "hint": "De-centralized = not all at the center.", "why": "", "opts": ["Decision-making is spread to managers throughout the company", "Only top executives make decisions", "Every division sets its own goals with no oversight", "All divisions share one budget"]}, {"t": "Advantage", "ask": "Which is an ADVANTAGE of decentralization?", "k": "mc", "learn": "Advantages: frees top managers, uses expert local knowledge, better customer relations, trains future leaders, improves motivation and retention. Disadvantages: possible bad decisions, poor coordination, duplicated costs, and goal congruence problems.", "steps": ["Local managers know their area best."], "hint": "The other options are actually disadvantages flipped.", "why": "", "opts": ["It frees top management's time and uses local managers' expert knowledge", "It always improves coordination", "It removes duplicated costs", "It eliminates goal congruence problems"]}, {"t": "Goal congruence", "ask": "A goal congruence problem means…", "k": "mc", "learn": "Goal congruence = everyone pulling the same way. A problem happens when a manager does what's best for their own division or bonus, not the whole company (for example, turning down a good project to protect ROI).", "steps": ["Manager's interest ≠ company's interest."], "hint": "Congruent = matching.", "why": "", "opts": ["A manager's own goals and the company's goals point in different directions", "Two divisions sell the same product", "The budget has errors", "Goals are set too high"]}, {"t": "Cost center", "ask": "The manager of a factory's production department controls costs but not sales. This is a…", "k": "mc", "learn": "Responsibility centers are judged on what the manager controls. Cost center: costs only (factory, accounting, HR). Profit center: revenue and costs (a store, a product line). Investment center: revenue, costs AND assets (a big division), judged on ROI and residual income.", "steps": ["Costs only → cost center."], "hint": "What does this manager control?", "why": "", "opts": ["Cost center", "Profit center", "Investment center", "Revenue center"]}, {"t": "Profit center", "ask": "A single store location whose manager is responsible for its sales and costs is a…", "k": "mc", "learn": "Profit centers are judged by actual profit vs. budgeted profit.", "steps": ["Revenue + costs → profit center."], "hint": "Sales AND costs.", "why": "", "opts": ["Profit center", "Cost center", "Investment center", "Service center"]}, {"t": "Investment center", "ask": "Which measures are used to judge an investment center?", "k": "mc", "learn": "Investment center managers also control the assets (they can buy equipment, open plants), so they're judged on how well they use those assets: ROI and residual income.", "steps": ["Assets involved → ROI and RI."], "hint": "It controls the investment.", "why": "", "opts": ["ROI and residual income", "Only costs", "Only sales growth", "Gross margin only"]}], "goal": "The key terms in plain words"}, {"id": "roi-c", "ch": "d11", "type": "roi", "title": "ROI, residual income & a new project", "ver": "Course example (West Division)", "story": "West Division is an investment center. Measure how it is doing, then decide whether its manager would accept a new project.", "givens": [["Average operating assets", "$600,000"], ["Operating income", "$150,000"], ["Sales", "$450,000"], ["Target (minimum) rate of return", "15%"], ["New project: added investment", "$100,000"], ["New project: added operating income", "$17,000"], ["New project: added sales", "$80,000"]], "table": {"title": "West Division Performance", "cols": ["", "Now", "Project alone"], "rows": [["Sales margin", "#mg", ""], ["Capital turnover", "#tn", ""], ["ROI", "#roi", "#proi"], ["Residual income", "#ri", "#pri"]]}, "parts": [{"t": "Sales margin", "ask": "What is the sales margin (operating income ÷ sales)? Enter as a percent.", "k": "num", "learn": "West Division is an investment center: its manager controls revenue, costs AND the assets used. It is judged on return on investment (ROI). ROI can be split in two: sales margin (how much profit each $1 of sales brings) × capital turnover (how many $ of sales each $1 of assets brings).", "steps": ["$150,000 ÷ $450,000 = 33.33%"], "hint": "Operating income ÷ sales.", "why": "", "ans": 33.33, "fmt": "%", "fills": {"mg": "33.33%"}}, {"t": "Capital turnover", "ask": "What is capital turnover (sales ÷ average operating assets)? Enter as a decimal, like 1.5.", "k": "num", "learn": "Capital turnover measures how hard the assets are working. A turnover of 2 means every $1 of assets brings in $2 of sales.", "steps": ["$450,000 ÷ $600,000 = 0.75"], "hint": "Sales ÷ assets.", "why": "", "ans": 0.75, "fmt": "x", "fills": {"tn": "0.75"}}, {"t": "Return on investment", "ask": "What is ROI? Enter as a percent.", "k": "num", "learn": "ROI = operating income ÷ average operating assets. It's the same as margin × turnover.", "steps": ["$150,000 ÷ $600,000 = 25.00%", "Check: 33.33% × 0.75 = 25.00%"], "hint": "Operating income ÷ assets.", "why": "", "ans": 25.0, "fmt": "%", "fills": {"roi": "25.00%"}}, {"t": "Residual income", "ask": "What is residual income?", "k": "num", "learn": "Residual income (RI) is the income left over AFTER meeting the company's minimum required return. Minimum income = target rate × assets. RI = operating income − (target rate × assets). Positive RI means the division beat the target.", "steps": ["Minimum income: 15% × $600,000 = $90,000", "RI = $150,000 − $90,000 = $60,000"], "hint": "Operating income − target % × assets.", "why": "", "ans": 60000.0, "fmt": "$", "fills": {"ri": "$60,000"}}, {"t": "Project ROI", "ask": "What is the ROI of the new project by itself? Enter as a percent.", "k": "num", "learn": "To judge a new project, look at its own return first.", "steps": ["$17,000 ÷ $100,000 = 17.00%"], "hint": "Project income ÷ project investment.", "why": "", "ans": 17.0, "fmt": "%", "fills": {"proi": "17.00%"}}, {"t": "Manager judged on ROI", "ask": "If the West Division manager is judged on ROI, will they want to accept the project?", "k": "mc", "learn": "A manager judged on ROI compares the project with the division's CURRENT ROI, because a lower-return project drags the average down.", "steps": ["Division ROI with the project: ($150,000 + $17,000) ÷ ($600,000 + $100,000) = 23.86%", "That is lower than 25.00% now."], "hint": "Compare with the division's ROI, not the target.", "why": "", "opts": ["No: the project's 17.00% ROI is below the division's current 25.00%, so it would pull the division's ROI down (to 23.86%)", "Yes: the project's 17.00% is above the 15% target", "Yes: any project with positive income raises ROI", "It depends only on the project's sales"]}, {"t": "Project residual income", "ask": "What is the residual income of the new project?", "k": "num", "learn": "Residual income for a project works the same way.", "steps": ["$17,000 − (15% × $100,000 = $15,000) = $2,000"], "hint": "Project income − target % × project investment.", "why": "", "ans": 2000.0, "fmt": "$", "fills": {"pri": "$2,000"}}, {"t": "Manager judged on residual income", "ask": "If the manager is judged on residual income instead, will they accept it? And does the company want it?", "k": "mc", "learn": "The company wants any project that beats its TARGET rate. Residual income uses that same target, so the manager and the company want the same thing. That agreement is called goal congruence. ROI can break it, which is why companies also use residual income.", "steps": ["Project RI = $2,000 (positive)", "Project ROI 17.00% vs. target 15%: beats it"], "hint": "Positive residual income → accept.", "why": "", "opts": ["Yes, and the company agrees: the project adds $2,000 of residual income because it beats the 15% target", "No, because it lowers ROI", "Yes, but the company doesn't want it", "No, residual income can't be used for projects"]}], "goal  X profit", "ask": "What is Division X's profit per unit?", "k": "num", "learn": "The transfer price is Division X's revenue. X's profit = transfer price − X's cost.", "steps": ["$70 − $50 = $20"], "hint": "Transfer price − X's cost.", "why": "", "ans": 20.0, "fmt": "$", "fills": {"x": "$20"}}, {"t": "Division Y profit", "ask": "What is Division Y's profit per unit?", "k": "num", "learn": "To Division Y, the transfer price is a COST, on top of its own finishing cost.", "steps": ["$120 − $70 − $25 = $25"], "hint": "Y's price − transfer price − Y's own cost.", "why": "", "ans": 25.0, "fmt": "$", "fills": {"y": "$25"}}, {"t": "Company profit", "ask": "What is the company's total profit per unit?", "k": "num", "learn": "Add the divisions, or skip the transfer price and use only outside sales and real costs. You get the same answer.", "steps": ["$20 + $25 = $45", "Or: $120 − $50 − $25 = $45"], "hint": "X profit + Y profit.", "why": "", "ans": 45.0, "fmt": "$", "fills": {"co": "$45"}}, {"t": "Change the transfer price", "ask": "If the transfer price rises to $60, what is the company's profit per unit?", "k": "num", "learn": "This is the key idea: the transfer price moves profit between divisions but does not change the total.", "steps": ["X: $60 − $50 = $10", "Y: $120 − $60 − $25 = $35", "Total still $45"], "hint": "Does the money leave the company?", "why": "", "ans": 45.0, "fmt": "$"}], "goal": "Transfer price is revenue to one division and cost to the other"}, {"id": "tp-c", "ch": "d11", "type": "tp", "title": "Transfer pricing", "ver": "Course example (Table & Chair)", "story": "Two divisions of the same company: Table Division makes a part that Chair Division uses. Find a fair transfer price range and what's best for the whole company.", "givens": [["Table Division: direct materials", "$136 per part"], ["Table Division: direct labor", "$200 per part"], ["Table Division: variable overhead", "$40 per part"], ["Table Division: fixed overhead", "$39 per part"], ["Fixed overhead avoided if it stops making the part", "one-third of it"], ["Price Chair Division would pay an outside supplier", "$448"], ["Current transfer price", "$384"], ["Table Division's proposed new price", "$480"], ["Table Division's capacity", "Excess capacity (idle space, no other use for it)"]], "table": {"title": "Transfer Price Range", "cols": ["", "Per unit"], "rows": [["Lowest price the seller accepts", "#mn"], ["Highest price the buyer accepts", "#mx"], ["Table Division's avoidable cost", "#av"]]}, "parts": [{"t": "What is a transfer price?", "ask": "Chair Division buys a part from Table Division, another division of the same company. Who is affected by the transfer price?", "k": "mc", "learn": "A transfer price is the price one division charges another division of the SAME company. Money just moves from one pocket to the other, so it shifts profit between divisions but the company's total profit stays the same. What matters for the company is the real cost of making the part vs. buying it outside.", "steps": ["Table Division records the transfer price as revenue.", "Chair Division records it as a cost.", "They cancel out for the company as a whole."], "hint": "Same company, two pockets.", "why": "", "opts": ["It is revenue to Table Division and a cost to Chair Division, but it doesn't change total company profit", "It raises total company profit when it goes up", "It only affects Chair Division", "It is paid to an outside supplier"]}, {"t": "Table Division's variable cost", "ask": "What is Table Division's variable cost per part?", "k": "num", "learn": "Variable costs (materials, labor, variable overhead) go away if you stop making the part.", "steps": ["$136 + $200 + $40 = $376"], "hint": "Add DM, DL and variable overhead.", "why": "", "ans": 376.0, "fmt": "$"}, {"t": "Avoidable cost", "ask": "One-third of fixed overhead could be avoided. What is the total AVOIDABLE cost per part?", "k": "num", "learn": "An avoidable cost is one that disappears if the divi function close(pt,v){let a=pt.ans;if(pt.fmt==="%"&&Math.abs(v)<=1.5&&Math.abs(a)>1.5)v*=100;
