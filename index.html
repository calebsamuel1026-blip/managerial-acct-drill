  <div class="card"><p class="cap">The situation</p><p class="story">${esc(p.story)}</p>${p.givens.length?`<dl class="giv">${p.givens.map(g=>`<dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join("")}</dl>`:""}</div>`;
  h+=tableHTML(p,cur,UI.just);
  for(let i=0;i<cur;i++){const pt=p.parts[i],s=r.s[i]||{};h+=`<details class="done-step"${UI.open===i?" open":""}><summary><span class="mk ${s.st==="ok"?"ok":"sh"}">${s.st==="ok"?"✓":"↺"}</span><span><span class="muted small">Step ${i+1}</span> ${esc(pt.t)}</span>${pt.k!=="mc"?`<span class="ans">${esc(fmtAns(pt))}</span>`:""}</summary><div class="body">${pt.k==="mc"?`<p style="margin:0"><b>Answer:</b> ${esc(pt.opts[0])}</p>`:""}${pt.learn?`<div class="learn"><b>The idea</b>${esc(pt.learn)}</div>`:""}${workHTML(pt)}</div></details>`}
  if(cur<p.parts.length)h+=stepHTML(p,cur);
  else{h+=`<div class="finish"><h3>Problem finished</h3><p style="margin:0 0 10px">You got <b>${st.first} of ${st.of}</b> steps right on the first try.${st.first<st.of?" The steps marked ↺ are the ones to look at again.":" Great work."}</p><div class="row">${(()=>{const nx=sib.find(id=>pstat(id).n<PBY[id].parts.length);return nx?`<button class="btn" data-open="${nx}">Try ${esc(PBY[nx].ver.replace(/ \(.*\)$/,""))} (new numbers) →</button>`:""})()}<button class="btn ghost" id="redo">Redo this one</button><button class="btn ghost" id="home2">All problems</button></div></div>`}
  app.innerHTML=h;
  app.querySelector("#back").onclick=()=>go({name:"home"});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go({name:"prob",id:b.dataset.open}));
  const rd=app.querySelector("#redo");if(rd)rd.onclick=()=>{delete ST.p[p.id];saveLocal();go({name:"prob",id:p.id})};
  const h2=app.querySelector("#home2");if(h2)h2.onclick=()=>go({name:"home"});
  if(cur<p.parts.length)wireStep(p,cur);
}

function stepHTML(p,i){const pt=p.parts[i],r=ps(p.id),s=r.s[i]||{};const solved=!!s.st;
  let h=`<div class="step" id="stepCard"><span class="eyebrow">Step ${i+1} of ${p.parts.length}</span><h3 style="margin-top:4px">${esc(pt.t)}</h3>`;
  if(pt.learn)h+=`<div class="learn"><b>Learn this first</b>${esc(pt.learn)}</div>`;
  else if(pt.again)h+=`<p class="again">Same method as before. Try it on your own first. Use Hint if you need it.</p>`;
  h+=`<p class="ask">${esc(pt.ask)}</p>`;
  if(pt.k==="mc"){h+=`<div class="opts">${shuffleFor(p.id+i,pt.opts).map(o=>{let c="";if(solved){if(o.i===0)c="right";else if(UI.pick===o.i)c="wrong"}return`<button class="opt ${c}" data-i="${o.i}" aria-pressed="${UI.pick===o.i}" ${solved?"disabled":""}>${esc(o.t)}</button>`}).join("")}</div>`}
  else{const pre=pt.fmt==="$"?"$":"",suf=pt.fmt==="%"?"%":pt.fmt==="u"?"":pt.fmt==="x"?"times":"";
    h+=`<div class="row"><label class="inp"><span>${pre}</span><input id="ans" inputmode="decimal" autocomplete="off" aria-label="Your answer" value="${esc(UI.val||"")}" ${solved?"disabled":""}><span>${suf}</span></label>${pt.k==="var"?`<div class="fu" role="group" aria-label="Favorable or unfavorable"><button data-fu="F" aria-pressed="${UI.fu==="F"}" ${solved?"disabled":""}>F · Favorable</button><button data-fu="U" aria-pressed="${UI.fu==="U"}" ${solved?"disabled":""}>U · Unfavorable</button></div>`:""}</div>`}
  if(!solved)h+=`<div class="row acts"><button class="btn" id="check">Check</button><button class="btn ghost" id="hint">Hint</button><button class="btn ghost" id="show">Show me how</button></div>`;
  if(UI.fb)h+=UI.fb;
  if(solved)h+=`<div class="row acts"><button class="btn" id="next">${i+1<p.parts.length?"Next step →":"Finish"}</button></div>`;
  return h+`</div>`}

function wireStep(p,i){const pt=p.parts[i],r=ps(p.id);const card=app.querySelector("#stepCard");
  const inp=card.querySelector("#ans");if(inp){inp.oninput=()=>UI.val=inp.value;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}}}
  card.querySelectorAll("[data-fu]").forEach(b=>b.onclick=()=>{UI.fu=b.dataset.fu;renderKeep()});
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{UI.pick=+b.dataset.i;check()});
  const c=card.querySelector("#check");if(c)c.onclick=check;
  const hn=card.querySelector("#hint");if(hn)hn.onclick=()=>{UI.fb=`<div class="fb hint"><div class="h">Hint</div>${esc(pt.hint||"Look back at the Learn box.")}</div>`;renderKeep()};
  const sh=card.querySelector("#show");if(sh)sh.onclick=()=>finish(false,true);
  const nx=card.querySelector("#next");if(nx){nx.onclick=()=>{r.cur=i+1;saveLocal();const j=i;UI={just:j};renderProb();const nc=app.querySelector("#stepCard")||app.querySelector(".finish");if(nc)nc.scrollIntoView({behavior:"smooth",block:"start"})};nx.focus({preventScroll:true})}
  function check(){const s=r.s[i]||(r.s[i]={tries:0});
    if(pt.k==="mc"){if(UI.pick==null)return;s.tries++;if(UI.pick===0)return finish(true);
      if(s.tries>=2)return finish(false,false);UI.fb=`<div class="fb no"><div class="h">Not quite.</div>That's a common mix-up. Re-read the Learn box and try once more. ${pt.hint?"Hint: "+esc(pt.hint):""}</div>`;UI.pick=null;return renderKeep()}
    const v=parseNum(UI.val);if(isNaN(v)){UI.fb=`<div class="fb hint"><div class="h">Type a number</div>Just the number, like 40200 or 40,200.${pt.fmt==="%"?" For a percent, type 25 for 25%.":""}</div>`;return renderKeep()}
    if(pt.k==="var"&&!UI.fu){UI.fb=`<div class="fb hint"><div class="h">One more thing</div>Also pick F (favorable) or U (unfavorable).</div>`;return renderKeep()}
    s.tries++;const numOk=close(pt,v),fuOk=pt.k!=="var"||UI.fu===pt.fu;
    if(numOk&&fuOk)return finish(true);
    if(s.tries>=3)return finish(false,false);
    let msg="Not quite.";if(pt.k==="var"&&numOk&&!fuOk)msg="The amount is right, but check favorable vs. unfavorable: does it make income higher (F) or lower (U)?";
    else if(pt.k==="var"&&!numOk&&fuOk)msg="F or U is right, but the amount is off.";
    else if(pt.fmt==="$"&&Math.abs(Math.abs(v)-Math.abs(pt.ans))<Math.abs(pt.ans)*0.002+0.02&&Math.sign(v)!==Math.sign(pt.ans))msg="Right size, wrong sign.";
    UI.fb=`<div class="fb no"><div class="h">${esc(msg)}</div>${s.tries===1?"Try again. Hint: "+esc(pt.hint||"Re-read the Learn box."):"One more try, or press Show me how."}</div>`;renderKeep()}
  function finish(ok,asked){const s=r.s[i]||(r.s[i]={tries:0});s.st=ok?"ok":"shown";s.first=ok&&s.tries<=1?1:0;saveLocal();
    UI.fb=ok?`<div class="fb ok"><div class="h">Correct!</div>${pt.k!=="mc"?`<b>${correctText(pt)}</b>`:""}<div style="margin-top:6px"><b>How it works:</b></div>${workHTML(pt)}</div>`
            :`<div class="fb ${asked?"hint":"no"}"><div class="h">${asked?"Here's how to do it":"Here's the answer"}</div><b>${correctText(pt)}</b>${workHTML(pt)}<p class="why muted">Read the steps, then keep going. You can redo this problem or try a Practice version later.</p></div>`;
    renderKeep()}
}
function renderKeep(){const y=window.scrollY;const keep=Object.assign({},UI);renderProb();UI=keep;window.scrollTo(0,y);const inp=app.querySelector("#stepCard #ans");if(inp&&!inp.disabled&&document.activeElement!==inp&&!("ontouchstart" in window))inp.focus({preventScroll:true})}

// ---- name prompt
const modal=document.getElementById("nameModal"),nameIn=document.getElementById("nameIn");
function askName(){modal.classList.remove("hide");nameIn.value=PLAYER?PLAYER.name:"";setTimeout(()=>nameIn.focus(),50)}
document.getElementById("nameGo").onclick=()=>{const n=nameIn.value.trim().replace(/\s+/g," ");if(!n)return nameIn.focus();PLAYER={name:n};try{localStorage.setItem(KEY+"-player",JSON.stringify(PLAYER))}catch(e){}modal.classList.add("hide");loadLocal();render();loadPlayer()};
nameIn.onkeydown=e=>{if(e.key==="Enter")document.getElementById("nameGo").click()};
document.getElementById("nameSkip").onclick=()=>{modal.classList.add("hide");PLAYER=null;try{localStorage.removeItem(KEY+"-player")}catch(e){}loadLocal();render();setSync("")};
document.getElementById("switch").onclick=askName;
loadLocal();render();if(PLAYER)loadPlayer();else askName();
</script></body></html>
